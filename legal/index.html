<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Roadside</title><link rel="icon" href="logo.png"><style>:root{--o:#F05424;--b:#1B3A93;--ink:#1A1410;--cream:#FFF4E6;--muted:#5E534A;--line:#EADCC8}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--cream);color:var(--ink);font:16px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
header{background:var(--b);color:#fff;padding:22px 16px}
header .in,main{max-width:760px;margin:0 auto}
header a{color:#fff;text-decoration:none;font-weight:800;letter-spacing:.04em}
header img{height:42px;vertical-align:middle}
nav{margin-top:12px;display:flex;gap:16px;flex-wrap:wrap;font-size:14px}
nav a{opacity:.85;font-weight:700}
nav a.on{opacity:1;border-bottom:2px solid var(--o)}
main{padding:28px 16px 64px}
h1{font-size:30px;line-height:1.2;margin:0 0 4px}
.date{color:var(--muted);font-size:14px;margin-bottom:24px}
h2{font-size:20px;margin:32px 0 8px;color:var(--b)}
a{color:var(--o)}
ul{padding-left:22px}
li{margin:4px 0}
table{border-collapse:collapse;width:100%;font-size:15px;margin:8px 0}
th,td{border:1px solid var(--line);padding:8px;text-align:left;vertical-align:top}
th{background:#fff}
.box{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin:18px 0}
.ar{direction:rtl;text-align:right;font-family:Tahoma,"Segoe UI",Arial,sans-serif}
footer{color:var(--muted);font-size:13px;text-align:center;padding:24px 16px}

.hero{text-align:center;padding:56px 16px} .hero img{height:90px} .links{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:24px}
.links a{background:var(--o);color:#fff;text-decoration:none;font-weight:800;padding:12px 18px;border-radius:24px}</style></head>
<body><header><div class="in"><a href="./"><img src="logo.png" alt="The Roadside"></a></div></header>
<main class="hero"><h1>The Roadside app</h1><p>Order from your pit stop, earn Road Points and play Roadside Rush.</p>
<div class="links"><a href="privacy">Privacy Policy</a><a href="terms">Terms of Use</a><a href="delete-account">Delete account</a></div></main>
<footer><a href="mailto:theroadsidebeirut@gmail.com">theroadsidebeirut@gmail.com</a></footer></body></html>
